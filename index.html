<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LABORATÓRIO 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game-canvas" tabindex="0"></canvas>

  <div id="hud">
    <div id="crosshair">
      <div class="ch-line top"></div>
      <div class="ch-line bottom"></div>
      <div class="ch-line left"></div>
      <div class="ch-line right"></div>
      <div class="ch-dot"></div>
    </div>

    <div id="room-name"></div>

    <div id="controls-hint">
      CLIQUE NO CHÃO PARA MOVER  |  BOTÃO DIREITO NA CRIANÇA — MENU CIRCULAR  |  TECLA [M] — MAPA TÁTICO
    </div>

    <div id="status">
      <div id="health-bar">
        <div id="health-fill"></div>
      </div>
      <span id="health-val">100</span>
    </div>

    <div id="start-screen" class="overlay active">
      <div class="overlay-card">
        <h1>LABORATÓRIO 3D</h1>
        <p>Explore as instalações de pesquisa</p>
        <button id="btn-start">ENTRAR NO LABORATÓRIO</button>
      </div>
    </div>

    <div id="pause-screen" class="overlay">
      <div class="overlay-card">
        <h2>PAUSADO</h2>
        <p>O jogo foi pausado</p>
        <button id="btn-resume">CONTINUAR</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
